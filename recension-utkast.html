  <style>
    /* Utkast 2026-10-24: tre förslag på recensionskort. Inte länkad någonstans. */
    body { margin: 0; font-family: 'Montserrat', sans-serif; }
    main { max-width: 440px; margin: 0 auto; padding: 28px 16px 60px; }
    .etikett { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gl-mjuk); margin: 40px 0 12px; }
    .etikett:first-child { margin-top: 0; }
    .g { width: 20px; height: 20px; flex: none; }
    .stj { color: #fbbc04; letter-spacing: 2px; font-size: 18px; line-height: 1; }

    /* Betygsrad, som i Smiles hero */
    .betyg { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: #fff; text-decoration: none; }
    .betyg .stj { font-size: 26px; }
    .betyg b { font-size: 20px; }
    .betyg u { font-size: 15px; text-underline-offset: 3px; }

    /* A – glaskort (samma stil som resten av sidan) */
    .rk-a {
      background: var(--gl-glas); border: 1px solid var(--gl-kant); border-radius: 22px; padding: 26px 24px 22px;
      -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%);
      box-shadow: 0 18px 40px -22px rgba(8,14,24,.7), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .rk-a q { display: block; font-size: 18px; font-weight: 600; line-height: 1.5; quotes: "”" "”"; }
    .rk-fot { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
    .rk-avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 20px; flex: none; }
    .rk-a .rk-avatar { background: rgba(255,255,255,.22); color: #fff; }
    .rk-namn { font-weight: 700; font-size: 15px; }
    .rk-datum { font-size: 13px; color: var(--gl-mjuk); }
    .rk-a .rk-g { margin-left: auto; display: flex; align-items: center; gap: 6px; }

    /* B – vitt kort, som Smile */
    .rk-b { background: #fff; color: #1e2b3c; border-radius: 22px; padding: 30px 26px 24px; box-shadow: 0 22px 44px -20px rgba(8,14,24,.65); }
    .rk-b q { display: block; font-size: 17px; font-weight: 500; line-height: 1.6; quotes: "”" "”"; }
    .rk-b .rk-namn { margin-top: 20px; }
    .rk-b .rk-datum { color: #6b7280; font-style: italic; }
    .rk-b .rk-rad { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
    .rk-b .rk-rad > span:not(.rk-avatar) { display: flex; align-items: center; gap: 8px; }
    .rk-b .rk-avatar { width: 56px; height: 56px; font-size: 24px; background: #6b8399; color: #fff; }

    /* C – glaskort med tjänst och vårt svar */
    .rk-c { margin: 0 0 18px; }
    .rk-tagg { display: inline-block; font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 99px; background: rgba(255,255,255,.18); border: 1px solid var(--gl-kant); margin-bottom: 14px; }
    .rk-svar { margin-top: 18px; padding: 12px 14px; border-left: 3px solid rgba(255,255,255,.5); background: rgba(255,255,255,.08); border-radius: 0 12px 12px 0; font-size: 14px; }
    .rk-svar small { display: block; font-size: 12px; color: var(--gl-mjuk); margin-bottom: 2px; }
  </style>
</head>
